<div class="section py-4">
    <div class="card overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-200">
            <h2 class="text-base font-semibold text-slate-900">Last {{checkpoints.checkpoints | length}} Checkpoints</h2>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Height</th>
                        <th>Block Hash</th>
                        <th>Checkpoint Quorum</th>
                    </tr>
                </thead>
                <tbody>
                    {%for cp in checkpoints.checkpoints%}
                    <tr>
                        <td class="whitespace-nowrap"><a href="/block/{{cp.height}}">{{cp.height}}</a></td>
                        <td class="font-mono text-xs"><a href="/block/{{cp.block_hash}}">{{cp.block_hash}}</a></td>
                        <td>
                            {%set sig_count = (cp.signatures or []) | length%}
                            <span class="text-slate-700 whitespace-nowrap">{{sig_count}}/20 signatures</span>
                            <span class="text-slate-700 whitespace-nowrap">{{sig_count}}/20 signatures</span>
                        </td>
                    </tr>
                    {%endfor%}
                </tbody>
            </table>
        </div>
    </div>
</div>
